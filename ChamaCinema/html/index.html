<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chama Cinema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/index.css">
    <link id="estampa" rel="stylesheet" href="../css/components/fundo_base.css">
    <link rel="shortcut icon" href="../Imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <header id="header">
        <a href="index.html" id="container-logo"><img src="../Imagens/Geral_7.png" alt="Logo do Chama Cinema" id="logo"> ChamaCinema</a>

        <form id="formulario-pesquisa">
            <div class="barra-pesquisa">
                <input id="pesquisa" type="text" placeholder="Procure por filmes ou séries...">
                <i class="fa-solid fa-magnifying-glass" id="lupa"></i>
            </div>
            <div id="resultados-pesquisa" class="resultados-pesquisa" aria-live="polite"></div>
        </form>

        <button class="opcoes_header" id="catalogo"><i class="fa-solid fa-clapperboard icone-header" id="catalogo-icone"></i><p>Catalogo</p></button>

        <a href="planos.html" class="opcoes_header" id="dire_plano"><i class="fa-solid fa-tag icone-header" id="etiqueta_plano"></i><p>Planos</p></a>

        <button class="opcoes_header" id="favoritos"><i class="fa-solid fa-heart icone-header" id="coracao_favoritos"></i><p>Favoritos</p></button>

        <button class="opcoes_header drop" onclick="dropdownMenu()" id="dropdown_icon" >
            <div id="usuario-login" class="opcoes_header"></div>
        </button>
        
        
        <div id="dropdown_menu" class="dropdown-menu">
            <table>
                <tr><td>
                    <p>
                        <a href="usuario.html">
                            <i class="fa-solid fa-gear"></i>
                            Configurações
                        </a>
                    </p>
                </td></tr>
            </table>
        </div>
    </header>

    <main>
        <div id="container-principal">
            <div class="carousel-container">
                            <div class="carousel-slides" id="carousel-slides">
                                    <p class="mensagem-carousel">Carregando destaques...</p>
                </div>
                            <button class="prev" type="button" aria-label="Filme anterior"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
                            <button class="next" type="button" aria-label="Próximo filme"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
              </div>
            <div id="planos"></div>

            <div class="container-catalogo">
                <h1>Filmes em alta</h1>
                <div class="catalogo-faixa">
                    <button class="catalogo-prev" type="button" aria-label="Filmes anteriores"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
                    <div id="container-em-alta">
                        <p class="mensagem-catalogo">Carregando filmes...</p>
                    </div>
                    <button class="catalogo-next" type="button" aria-label="Próximos filmes"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
                </div>
            </div>
            
            <div class="container-catalogo" id="prefs">
            </div>
        </div>
    </main>

    <footer>

        <div id="footer-container">
            <p id="footer-suporte"><i class="fa-regular fa-circle-question" aria-hidden="true"></i> Suporte e recomendações para sua próxima sessão</p>
            <p id="footer-texto">© 2024 ChamaCinema. Todos os direitos reservados.</p>
        </div>

    </footer>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/manipulaLS.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/index.js"></script>
    <script src="../js/produtor.js"></script>
</body>
</html>
