<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/catalogo.css">
    <link id="estampa" rel="stylesheet" href="../css/components/fundo_base.css">
    <link rel="shortcut icon" href="../Imagens/favicon.ico" type="image/x-icon">
    <title>Catalogo</title>
</head>
<body>
    <header id="header">
        <a href="index.html" id="container-logo"><img src="../Imagens/Geral_7.png" alt="Logo do Chama Cinema" id="logo"> ChamaCinema</a>

        <form id="formulario-pesquisa">
            <div class="barra-pesquisa">
                <input id="pesquisa" type="text" placeholder="Procure por filmes ou séries...">
                <i class="fa-solid fa-magnifying-glass" id="lupa"></i>
            </div>
            <div id="resultados-pesquisa" class="resultados-pesquisa" aria-live="polite"></div>
        </form>

        <button class="opcoes_header" id="catalogo"><i class="fa-solid fa-clapperboard icone-header" id="catalogo-icone"></i><p>Catalogo</p></button>

        <a href="planos.html" class="opcoes_header" id="dire_plano"><i class="fa-solid fa-tag icone-header" id="etiqueta_plano"></i><p>Planos</p></a>

        <button class="opcoes_header" id="favoritos"><i class="fa-solid fa-heart icone-header" id="coracao_favoritos"></i><p>Favoritos</p></button>

        <button class="opcoes_header drop" onclick="dropdownMenu()" id="dropdown_icon" >
            <div id="usuario-login" class="opcoes_header"></div>
        </button>
        
        
        <div id="dropdown_menu" class="dropdown-menu">
            <table>
                <tr><td>
                    <p>
                        <a href="usuario.html">
                            <i class="fa-solid fa-gear"></i>
                            Configurações
                        </a>
                    </p>
                </td></tr>
            </table>
        </div>
    </header>

    <main>
        <div id="container-principal">

            <div class="genres-grid">
                    <button class="genre-btn" id="genero-28" onclick="imagemFilme(28)">Ação</button>
                    <button class="genre-btn" id="genero-12" onclick="imagemFilme(12)">Aventura</button>
                    <button class="genre-btn" id="genero-16" onclick="imagemFilme(16)">Animação</button>
                    <button class="genre-btn" id="genero-35" onclick="imagemFilme(35)">Comédia</button>
                    <button class="genre-btn" id="genero-80" onclick="imagemFilme(80)">Crime</button>
                    <button class="genre-btn" id="genero-99" onclick="imagemFilme(99)">Documentário</button>
                    <button class="genre-btn" id="genero-18" onclick="imagemFilme(18)">Drama</button>
                    <button class="genre-btn" id="genero-10751" onclick="imagemFilme(10751)">Família</button>
                    <button class="genre-btn" id="genero-14" onclick="imagemFilme(14)">Fantasia</button>
                    <button class="genre-btn" id="genero-36" onclick="imagemFilme(36)">História</button>
                    <button class="genre-btn" id="genero-27" onclick="imagemFilme(27)">Terror</button>
                    <button class="genre-btn" id="genero-10402" onclick="imagemFilme(10402)">Música</button>
                    <button class="genre-btn" id="genero-9648" onclick="imagemFilme(9648)">Mistério</button>
                    <button class="genre-btn" id="genero-10749" onclick="imagemFilme(10749)">Romance</button>
                    <button class="genre-btn" id="genero-878" onclick="imagemFilme(878)">Ficção científica</button>
                    <button class="genre-btn" id="genero-53" onclick="imagemFilme(53)">Horror</button>
                    <button class="genre-btn" id="genero-10752" onclick="imagemFilme(10752)">Guerra</button>
                    <button class="genre-btn" id="genero-37" onclick="imagemFilme(37)">Faroeste</button>
            </div>
            <div id="container-filmes"></div>
        </div>
    </main>

    <footer>

        <div id="footer-container">
            <p id="footer-suporte"><i class="fa-regular fa-circle-question" aria-hidden="true"></i> Suporte e recomendações para sua próxima sessão</p>
            <p id="footer-texto">© 2024 ChamaCinema. Todos os direitos reservados.</p>
        </div>

    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/manipulaLS.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/catalogo.js"></script>

</body>
</html>
