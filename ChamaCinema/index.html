<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chama Cinema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages/index.css">
</head>

<body>
   <header id="header">
        <a href="index.html" id="container-logo"><img src="Imagens/Geral_7.png" alt="Logo do Chama Cinema" id="logo"> ChamaCinema</a>

        <form id="formulario-pesquisa">
            <div class="barra-pesquisa">
                <input id="pesquisa" type="text" placeholder="Procure por filmes ou séries...">
                <i class="fa-solid fa-magnifying-glass" id="lupa"></i>
            </div>
            <div id="resultados-pesquisa" class="resultados-pesquisa" aria-live="polite"></div>
        </form>

        <button class="opcoes_header"><i class="fa-solid fa-clapperboard icone-header" id="catalogo-icone"></i><p>Catalogo</p></button>
        <button class="opcoes_header"><i class="fa-solid fa-tag icone-header" id="etiqueta_plano"></i><p>Planos</p></button>
        <button class="opcoes_header"><i class="fa-solid fa-heart icone-header" id="coracao_favoritos"></i><p></p>Favoritos</p></button>
        <a href="login.html" class="opcoes_header"><i class="fa-solid fa-user icone-header" id="pessoa_login"></i><p>Login</p></a>
        <button class="opcoes_header"><i class="fas fa-ellipsis-vertical fa-lg" id="dropdown_icon"></i> </button>
    </header>

    <main>
        <div class="carousel-container">
                        <div class="carousel-slides" id="carousel-slides">
                                <p class="mensagem-carousel">Carregando destaques...</p>
            </div>
                        <button class="prev" type="button" aria-label="Filme anterior" onclick="moveSlide(-1)">❮</button>
                        <button class="next" type="button" aria-label="Próximo filme" onclick="moveSlide(1)">❯</button>
          </div>
        <div id="container-catalogo">
            <h1>Filmes em alta</h1>
            <div class="catalogo-faixa">
                <button class="catalogo-prev" type="button" aria-label="Filmes anteriores" onclick="moverCatalogo(-1)">❮</button>
                <div id="container-em-alta">
                    <p class="mensagem-catalogo">Carregando filmes...</p>
                </div>
                <button class="catalogo-next" type="button" aria-label="Próximos filmes" onclick="moverCatalogo(1)">❯</button>
            </div>
        </div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/header.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
